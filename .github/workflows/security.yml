# PawCare: supply-chain auditing and optional GitHub code scanning.
# Public repositories run CodeQL/Dependency Review automatically once code exists.
# Private repositories can opt in when eligible via repository variables:
#   PAWCARE_ENABLE_CODEQL=true
#   PAWCARE_ENABLE_DEPENDENCY_REVIEW=true
name: PawCare Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1' # Weekly, Monday 03:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pawcare-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect auditable modules
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.modules.outputs.backend }}
      web: ${{ steps.modules.outputs.web }}
      mobile: ${{ steps.modules.outputs.mobile }}
      js: ${{ steps.modules.outputs.js }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: modules
        shell: bash
        run: |
          if [[ -f backend/PawCare.Api/PawCare.Api.csproj ]]; then echo 'backend=true' >> "$GITHUB_OUTPUT"; else echo 'backend=false' >> "$GITHUB_OUTPUT"; fi
          if [[ -f frontend/package.json ]]; then echo 'web=true' >> "$GITHUB_OUTPUT"; else echo 'web=false' >> "$GITHUB_OUTPUT"; fi
          if [[ -f mobile/package.json ]]; then echo 'mobile=true' >> "$GITHUB_OUTPUT"; else echo 'mobile=false' >> "$GITHUB_OUTPUT"; fi
          if [[ -f frontend/package.json || -f mobile/package.json ]]; then echo 'js=true' >> "$GITHUB_OUTPUT"; else echo 'js=false' >> "$GITHUB_OUTPUT"; fi

  nuget-audit:
    name: NuGet / high and critical vulnerabilities
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore and enforce high/critical NuGet audit
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore backend/PawCare.Api/PawCare.Api.csproj \
            -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=high \
            --force --no-cache 2>&1 | tee nuget-audit.log
          if grep -Eq 'NU190[34]:' nuget-audit.log; then
            echo 'High or critical NuGet dependency vulnerabilities detected.'
            exit 1
          fi

  npm-web-audit:
    name: npm / web high and critical vulnerabilities
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Audit lockfile (including dev dependencies)
        run: |
          test -f package-lock.json || { echo 'Missing frontend/package-lock.json'; exit 1; }
          npm audit --package-lock-only --audit-level=high

  npm-mobile-audit:
    name: npm / mobile high and critical vulnerabilities
    needs: detect
    if: needs.detect.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Audit lockfile (including dev dependencies)
        run: |
          test -f package-lock.json || { echo 'Missing mobile/package-lock.json'; exit 1; }
          npm audit --package-lock-only --audit-level=high

  codeql-csharp:
    name: CodeQL / C#
    needs: detect
    if: needs.detect.outputs.backend == 'true' && (github.event.repository.private == false || vars.PAWCARE_ENABLE_CODEQL == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp

  codeql-typescript:
    name: CodeQL / JS and TypeScript
    needs: detect
    if: needs.detect.outputs.js == 'true' && (github.event.repository.private == false || vars.PAWCARE_ENABLE_CODEQL == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  dependency-review:
    name: Dependency review / pull requests
    if: github.event_name == 'pull_request' && (github.event.repository.private == false || vars.PAWCARE_ENABLE_DEPENDENCY_REVIEW == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
